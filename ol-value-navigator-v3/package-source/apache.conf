# Private single-user V3 package. No public listener or new OCI network rule.
Listen 127.0.0.1:8009
<VirtualHost 127.0.0.1:8009>
    ServerName localhost
    DocumentRoot "/opt/olvn-v3/package-r3/app/public"
    DirectoryIndex package-index.php
    ProxyTimeout 300
    RedirectMatch 302 ^/$ /demo/coverage
    <Directory "/opt/olvn-v3/package-r3/app/public">
        Options -Indexes -MultiViews
        AllowOverride None
        Require local
        FallbackResource /package-index.php
        <Files "index.php">
            Require all denied
        </Files>
    </Directory>
    ErrorLog /var/log/httpd/olvn-v3-package-error.log
    CustomLog /var/log/httpd/olvn-v3-package-access.log combined
</VirtualHost>
