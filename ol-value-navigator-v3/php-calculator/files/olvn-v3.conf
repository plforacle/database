# Private single-user rehearsal. Do not bind this listener to all interfaces.
Listen 127.0.0.1:8008
<VirtualHost 127.0.0.1:8008>
    ServerName localhost
    DocumentRoot "/opt/olvn-v3/app/public"
    DirectoryIndex workshop-index.php
    ProxyTimeout 300
    RedirectMatch 302 ^/$ /demo
    <Directory "/opt/olvn-v3/app/public">
        Options -Indexes
        AllowOverride None
        Require local
        FallbackResource /workshop-index.php
        <Files "index.php">
            Require all denied
        </Files>
    </Directory>
    ErrorLog /var/log/httpd/olvn-v3-error.log
    CustomLog /var/log/httpd/olvn-v3-access.log combined
</VirtualHost>
