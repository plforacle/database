<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Oracle Linux Value Navigator system architecture</title>
  <desc id="diagram-description">An Oracle representative uses a browser to paste complete RHEL and Oracle Linux SKU text into a PHP application running on an Oracle Linux compute instance. The PHP application sends each input to MySQL HeatWave GenAI for structured suggestions. The representative reviews and confirms the suggestions. PHP calculates the results, and the MySQL HeatWave DB System stores the original inputs, suggestions, decisions, and results.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c74634"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1f2937">Oracle Linux Value Navigator Architecture</text>
  <text x="700" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5563">AI formats. The representative confirms. PHP calculates. The DB System preserves the comparison.</text>

  <rect x="300" y="110" width="1060" height="590" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="330" y="145" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Oracle Cloud Infrastructure VCN</text>

  <rect x="335" y="165" width="455" height="495" rx="14" fill="#fff7f5" stroke="#c74634" stroke-width="2"/>
  <text x="360" y="198" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#9f2d20">Public subnet</text>

  <rect x="825" y="165" width="500" height="495" rx="14" fill="#f2f7fb" stroke="#2563a5" stroke-width="2"/>
  <text x="850" y="198" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1e4f7a">Private subnet</text>

  <g filter="url(#shadow)">
    <rect x="35" y="220" width="225" height="330" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  </g>
  <circle cx="147" cy="275" r="34" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <circle cx="147" cy="265" r="10" fill="#4b5563"/>
  <path d="M126 293 Q147 275 168 293" fill="none" stroke="#4b5563" stroke-width="7" stroke-linecap="round"/>
  <text x="147" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f2937">Oracle representative</text>
  <text x="147" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#374151">Web browser</text>
  <rect x="60" y="395" width="175" height="50" rx="8" fill="#fef2f2" stroke="#c74634"/>
  <text x="147" y="416" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9f2d20">Complete RHEL</text>
  <text x="147" y="434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9f2d20">freeform SKU text</text>
  <rect x="60" y="458" width="175" height="50" rx="8" fill="#fef2f2" stroke="#c74634"/>
  <text x="147" y="479" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9f2d20">Complete Oracle Linux</text>
  <text x="147" y="497" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9f2d20">freeform SKU text</text>
  <text x="147" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">Demonstration or redacted data only</text>

  <g filter="url(#shadow)">
    <rect x="375" y="220" width="375" height="395" rx="14" fill="#ffffff" stroke="#c74634" stroke-width="2"/>
  </g>
  <text x="562" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Oracle Linux 9 Compute</text>
  <text x="562" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">ol-value-navigator-2-app</text>

  <rect x="410" y="300" width="305" height="58" rx="8" fill="#fff7f5" stroke="#c74634"/>
  <text x="562" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#9f2d20">Apache HTTP Server</text>
  <text x="562" y="347" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">Serves the browser pages</text>

  <rect x="410" y="380" width="305" height="190" rx="8" fill="#f9fafb" stroke="#64748b"/>
  <text x="562" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1f2937">PHP application</text>
  <text x="435" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">1. Capture and save both complete inputs</text>
  <text x="435" y="468" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">2. Validate structured AI suggestions</text>
  <text x="435" y="496" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">3. Present correction and alignment UI</text>
  <text x="435" y="524" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">4. Calculate 1, 3, and 5 year totals</text>
  <text x="435" y="552" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#9f2d20">Deterministic calculations run only in PHP</text>

  <g filter="url(#shadow)">
    <rect x="865" y="220" width="420" height="395" rx="14" fill="#ffffff" stroke="#2563a5" stroke-width="2"/>
  </g>
  <text x="1075" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1f2937">MySQL HeatWave DB System</text>
  <text x="1075" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">Private IP address</text>

  <rect x="905" y="300" width="340" height="105" rx="8" fill="#eef6ff" stroke="#2563a5"/>
  <text x="1075" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1e4f7a">MySQL HeatWave GenAI</text>
  <text x="1075" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">sys.ML_GENERATE formats each input</text>
  <text x="1075" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">Returns candidates, never approvals</text>

  <rect x="905" y="430" width="340" height="140" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="1075" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1f2937">Saved comparison database</text>
  <text x="930" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">• Complete original RHEL and Oracle Linux text</text>
  <text x="930" y="516" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">• AI suggestions and representative decisions</text>
  <text x="930" y="542" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151">• Rule version, results, and workflow events</text>
  <text x="1075" y="598" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#9f2d20">No master RHEL or Oracle Linux product catalog</text>

  <line x1="260" y1="329" x2="400" y2="329" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="330" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">HTTP prototype</text>
  <line x1="715" y1="350" x2="895" y2="350" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="895" y1="376" x2="715" y2="376" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="805" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Prompt</text>
  <text x="805" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Structured suggestions</text>
  <line x1="715" y1="500" x2="895" y2="500" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="895" y1="526" x2="715" y2="526" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="805" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Save</text>
  <text x="805" y="551" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#374151">Reopen</text>

  <rect x="360" y="628" width="410" height="54" rx="8" fill="#fef2f2" stroke="#c74634" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="565" y="651" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#9f2d20">Human approval boundary</text>
  <text x="565" y="670" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9f2d20">Representative confirmation is required before totals appear</text>

  <text x="50" y="755" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Application flow</text>
  <line x1="75" y1="810" x2="1325" y2="810" stroke="#d1d5db" stroke-width="4"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <circle cx="115" cy="810" r="20" fill="#c74634"/><text x="115" y="816" font-size="15" font-weight="700" fill="#ffffff">1</text>
    <text x="115" y="850" font-size="13" fill="#374151">Paste both</text><text x="115" y="868" font-size="13" fill="#374151">complete inputs</text>
    <circle cx="350" cy="810" r="20" fill="#c74634"/><text x="350" y="816" font-size="15" font-weight="700" fill="#ffffff">2</text>
    <text x="350" y="850" font-size="13" fill="#374151">Save original</text><text x="350" y="868" font-size="13" fill="#374151">text</text>
    <circle cx="585" cy="810" r="20" fill="#2563a5"/><text x="585" y="816" font-size="15" font-weight="700" fill="#ffffff">3</text>
    <text x="585" y="850" font-size="13" fill="#374151">Format with</text><text x="585" y="868" font-size="13" fill="#374151">MySQL HeatWave GenAI</text>
    <circle cx="820" cy="810" r="20" fill="#c74634"/><text x="820" y="816" font-size="15" font-weight="700" fill="#ffffff">4</text>
    <text x="820" y="850" font-size="13" fill="#374151">Review, align,</text><text x="820" y="868" font-size="13" fill="#374151">and confirm</text>
    <circle cx="1055" cy="810" r="20" fill="#4b5563"/><text x="1055" y="816" font-size="15" font-weight="700" fill="#ffffff">5</text>
    <text x="1055" y="850" font-size="13" fill="#374151">Calculate in</text><text x="1055" y="868" font-size="13" fill="#374151">PHP</text>
    <circle cx="1290" cy="810" r="20" fill="#2563a5"/><text x="1290" y="816" font-size="15" font-weight="700" fill="#ffffff">6</text>
    <text x="1290" y="850" font-size="13" fill="#374151">Save and reopen</text><text x="1290" y="868" font-size="13" fill="#374151">results</text>
  </g>
</svg>
